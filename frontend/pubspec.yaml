name: frontend
description: "SapuLidi SuperApp - Manajemen RT"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  google_fonts: ^9.0.0

  # --- FASE 1: Timestamp Camera ---
  camera: ^0.11.0        # kamera kustom (CameraPreview + takePicture)
  path_provider: ^2.1.0  # menyimpan hasil foto bertimestamp ke storage aplikasi
  # image_picker DIHAPUS: tidak lagi dipakai (hanya detail_event_screen.dart yang memakainya)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true